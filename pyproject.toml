[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obfus"
version = "0.1.0"
description = "Local-first code obfuscator with deterministic restore (Python port)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=41",
    "pathspec>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
obfus = "obfus.cli:main"

[tool.setuptools.packages.find]
include = ["obfus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
